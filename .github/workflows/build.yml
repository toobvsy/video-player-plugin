name: Fabriquer l'installateur Mac

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Compiler le plugin
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Préparer l'installateur
        run: |
          VST3=$(find build -type d -name "Video Player.vst3" | head -n 1)
          AU=$(find build -type d -name "Video Player.component" | head -n 1)
          echo "VST3: $VST3"
          echo "AU: $AU"
          test -d "$VST3"

          mkdir -p payload/Library/Audio/Plug-Ins/VST3 payload/Library/Audio/Plug-Ins/Components
          cp -R "$VST3" payload/Library/Audio/Plug-Ins/VST3/
          [ -d "$AU" ] && cp -R "$AU" payload/Library/Audio/Plug-Ins/Components/ || true

          codesign --force --deep -s - payload/Library/Audio/Plug-Ins/VST3/*.vst3
          [ -d payload/Library/Audio/Plug-Ins/Components/"Video Player.component" ] && \
            codesign --force --deep -s - payload/Library/Audio/Plug-Ins/Components/*.component || true

          mkdir -p dmg
          pkgbuild --root payload \
                   --identifier com.monstudio.videoplayer \
                   --version 0.2.0 \
                   --install-location / \
                   "dmg/Installer Video Player.pkg"

          hdiutil create -volname "Video Player" \
                         -srcfolder dmg \
                         -ov -format UDZO \
                         VideoPlayer-Mac.dmg

      - name: Mettre à disposition le DMG
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Mac
          path: VideoPlayer-Mac.dmg

      - name: Publier dans les "Releases" (si version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoPlayer-Mac.dmg
